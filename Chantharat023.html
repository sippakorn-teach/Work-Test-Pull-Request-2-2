<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Profile - จันทรัศม์ ชนะกุล</title>
    <style>
        :root {
            --bg-primary: #fff0f5;
            --bg-card: #ffffff;
            --pink-main: #ff69b4;
            --pink-dark: #d81b60;
            --pink-light: #ffe4e1;
            --text-main: #4a3e43;
            --text-muted: #8c7a82;
            --border-color: #f8c8dc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            padding: 2rem;
            max-width: 900px;
            margin: 0 auto;
        }

        /* Top Bar */
        .navbar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 1.5rem;
            margin-bottom: 2rem;
            border-bottom: 2px solid var(--border-color);
            color: var(--pink-dark);
            font-weight: bold;
            font-size: 1.2rem;
        }

        /* Layout Grid */
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        /* Info Boxes */
        .box {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.08);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .box:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 105, 180, 0.15);
            border-color: var(--pink-main);
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .box-title {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            font-weight: bold;
        }

        .box-content {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--pink-dark);
        }

        .tag-container {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-top: 0.5rem;
        }

        .tag {
            background-color: var(--pink-light);
            color: var(--pink-dark);
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        /* GitHub Contribution Grid */
        .graph-title {
            font-size: 1rem;
            color: var(--pink-dark);
            margin-bottom: 1rem;
            font-weight: bold;
        }

        .graph-mock {
            display: grid;
            grid-template-columns: repeat(16, 1fr);
            gap: 6px;
        }

        .graph-day {
            width: 100%;
            padding-top: 100%;
            border-radius: 4px;
        }

        .c-1 { background-color: var(--pink-light); }
        .c-2 { background-color: #ffb6c1; }
        .c-3 { background-color: #ff69b4; }
        .c-4 { background-color: #d81b60; }

        @media (max-width: 600px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
