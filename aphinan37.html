<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แนะนำตัว - อภินันท์ เกษี</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Kanit', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f111a;
            overflow-x: hidden;
            padding: 20px;
        }

        /* ปรับพื้นหลังสีรุ้งให้นุ่มนวล ชะลอความเร็ว ไม่ฟึดฟัดแสบตา */
        .rainbow-bg {
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(
                from 0deg,
                #ff6b6b, #fca5a5, #fde047, #86efac, 
                #67e8f9, #93c5fd, #c084fc, #f472b6, #ff6b6b
            );
            animation: rotate 20s linear infinite;
            filter: blur(120px);
            opacity: 0.18;
            z-index: 1;
        }

        @keyframes rotate {
            100% { transform: rotate(360deg); }
        }

        /* การ์ดแนะนำตัวสไตล์ Glassmorphism */
        .card {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 450px;
            background: rgba(22, 27, 38, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* เส้นขอบสีรุ้งพาสเทลแบบนุ่มนวล */
        .card::before {
            content: '';
            position: absolute;
            top: -1px; left: -1px; right: -1px; bottom: -1px;
            background: linear-gradient(135deg, #ff758c, #ff7eb3, #70a1ff, #2ed573, #ffa502);
            border-radius: 25px;
            z-index: -1;
            opacity: 0.6;
            background-size: 300% 300%;
            animation: soft-rainbow 8s ease infinite;
        }

        @keyframes soft-rainbow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* รูปโปรไฟล์ */
        .avatar-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        /* ข้อความสีรุ้งซอฟต์ๆ สบายตา */
        .rainbow-text {
            background: linear-gradient(120deg, #ff758c, #ff8e53, #fbc531, #4cd137, #00a8ff, #9c88ff);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shine 6s linear infinite;
            font-weight: 700;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .badge {
            display: inline-block;
            padding: 5px 14px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            color: #a0aec0;
            font-size: 0.85rem;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* รายละเอียดข้อมูล */
        .info-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 25px;
            text-align: left;
        }

        .info-item {
            display: flex;
            align-items: center;
            color: #d1d5db;
            margin-bottom: 14px;
            font-size: 0.95rem;
        }

        .info-item:last-child {
            margin-bottom: 0;
        }

        .info-item i {
            width: 28px;
            font-size: 1.1rem;
            margin-right: 10px;
            opacity: 0.9;
        }

        /* ปุ่ม Social Media */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .social-btn {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #a0aec0;
            text-decoration: none;
            font-size: 1.1rem;
            background: rgba(255, 255, 255, 0.05);
            transition: all 0.25s ease;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .social-btn:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <div class="rainbow-bg"></div>

    <div class="card">
        <div class="avatar-container">
            <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Aphinan" alt="Profile" class="avatar">
        </div>

        <h1 class="rainbow-text">อภินันท์ เกษี</h1>
        <div class="badge">Information Technology</div>

        <div class="info-box">
            <div class="info-item">
                <i class="fa-solid fa-id-card rainbow-text"></i>
                <span><strong>รหัสนักศึกษา:</strong> 68219010037</span>
            </div>
            <div class="info-item">
                <i class="fa-solid fa-laptop-code rainbow-text"></i>
                <span><strong>แผนก:</strong> เทคโนโลยีสารสนเทศ</span>
            </div>
            <div class="info-item">
                <i class="fa-solid fa-heart rainbow-text"></i>
                <span><strong>ความสนใจ:</strong> Web Development & Tech</span>
            </div>
        </div>

        <div class="social-links">
            <a href="https://github.com" target="_blank" class="social-btn"><i class="fa-brands fa-github"></i></a>
            <a href="https://facebook.com" target="_blank" class="social-btn"><i class="fa-brands fa-facebook"></i></a>
            <a href="https://instagram.com" target="_blank" class="social-btn"><i class="fa-brands fa-instagram"></i></a>
        </div>
    </div>

</body>
</html>
