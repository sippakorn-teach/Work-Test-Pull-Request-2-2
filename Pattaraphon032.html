<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IT Student Profile</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Orbitron:wght@500;600;700&display=swap');

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            font-family: 'Kanit', sans-serif;
            color: white;

            background:
                radial-gradient(circle at 50% 0%, #063b5c, transparent 40%),
                linear-gradient(135deg, #02080d, #031923, #02080d);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 10px;

            overflow: hidden;
        }

        /* =========================
           Grid พื้นหลัง
        ========================= */

        body::before {
            content: "";
            position: fixed;
            inset: 0;

            background-image:
                linear-gradient(rgba(0, 229, 255, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 229, 255, 0.06) 1px, transparent 1px);

            background-size: 40px 40px;

            pointer-events: none;
        }

        /* =========================
           พื้นหลัง IT
        ========================= */

        .tech-background {
            position: fixed;
            inset: 0;

            pointer-events: none;
            z-index: 1;
        }

        /* คอมพิวเตอร์ด้านซ้าย */
        .computer {
            position: absolute;

            left: 4%;
            bottom: 5%;

            width: 120px;

            opacity: 0.14;
        }

        .monitor {
            width: 110px;
            height: 65px;

            border: 3px solid #00e5ff;
            border-radius: 7px;

            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
        }

        .screen {
            width: 90px;
            height: 47px;

            margin: 6px auto;

            border: 1px solid #00ff9d;

            position: relative;
        }

        .screen::after {
            content: "> IT_SYSTEM";

            position: absolute;
            left: 6px;
            top: 5px;

            color: #00ff9d;

            font-family: monospace;
            font-size: 8px;
        }

        .monitor-stand {
            width: 23px;
            height: 10px;

            margin: auto;

            border-left: 3px solid #00e5ff;
            border-right: 3px solid #00e5ff;
        }

        .monitor-base {
            width: 50px;
            height: 3px;

            margin: auto;

            background: #00e5ff;
        }

        /* =========================
           Siberian Cat
        ========================= */

        .siberian-cat {
            position: absolute;

            right: 4%;
            bottom: 6%;

            width: 145px;

            opacity: 0.22;

            filter:
                drop-shadow(0 0 8px rgba(0, 229, 255, 0.6));

            text-align: center;

            color: #b8f5ff;
        }

        .cat {
            position: relative;

            width: 110px;
            height: 90px;

            margin: auto;
        }

        /* หู */
        .ear {
            position: absolute;

            top: 0;

            width: 35px;
            height: 35px;

            background: #b8f5ff;

            border: 3px solid #00e5ff;

            transform: rotate(45deg);

            border-radius: 6px 2px 6px 2px;
        }

        .ear.left {
            left: 13px;
        }

        .ear.right {
            right: 13px;
        }

        /* หน้าแมว */
        .cat-face {
            position: absolute;

            left: 5px;
            top: 18px;

            width: 100px;
            height: 75px;

            background:
                radial-gradient(
                    circle at 50% 20%,
                    #d9faff,
                    #8bdbea 70%,
                    #45aabd
                );

            border: 3px solid #00e5ff;

            border-radius: 48% 48% 45% 45%;

            box-shadow:
                0 0 18px rgba(0, 229, 255, 0.45);
        }

        /* ตา */
        .eye {
            position: absolute;

            top: 28px;

            width: 13px;
            height: 17px;

            background: #07151d;

            border: 2px solid #00ff9d;

            border-radius: 50%;

            box-shadow: 0 0 7px #00ff9d;
        }

        .eye.left {
            left: 25px;
        }

        .eye.right {
            right: 25px;
        }

        /* จมูก */
        .nose {
            position: absolute;

            left: 43px;
            top: 46px;

            width: 14px;
            height: 10px;

            background: #63dff0;

            border: 2px solid #00e5ff;

            border-radius: 50%;
        }

        /* ปาก */
        .mouth {
            position: absolute;

            left: 45px;
            top: 55px;

            width: 10px;
            height: 8px;

            border-bottom: 2px solid #00e5ff;
            border-radius: 50%;
        }

        /* หนวด */
        .whisker {
            position: absolute;

            width: 34px;
            height: 1px;

            background: #7ddfff;

            top: 52px;

            opacity: 0.8;
        }

        .whisker.left-1 {
            left: -27px;
            transform: rotate(8deg);
        }

        .whisker.left-2 {
            left: -27px;
            top: 59px;
            transform: rotate(-8deg);
        }

        .whisker.right-1 {
            right: -27px;
            transform: rotate(-8deg);
        }

        .whisker.right-2 {
            right: -27px;
            top: 59px;
            transform: rotate(8deg);
        }

        .cat-label {
            margin-top: 2px;

            font-family: 'Orbitron', sans-serif;

            font-size: 8px;

            color: #63dff0;

            letter-spacing: 1px;
        }

        /* =========================
           การ์ดหลัก
        ========================= */

        .card {
            position: relative;

            width: min(450px, 100%);
            max-height: 96vh;

            padding: 20px 22px;

            background: rgba(2, 13, 20, 0.97);

            border: 2px solid transparent;
            border-radius: 14px;

            background-image:
                linear-gradient(
                    rgba(2, 13, 20, 0.97),
                    rgba(2, 13, 20, 0.97)
                ),
                linear-gradient(
                    120deg,
                    #003cff,
                    #00aaff,
                    #b8f5ff,
                    #00e5ff,
                    #0066ff,
                    #003cff
                );

            background-size:
                100% 100%,
                300% 300%;

            background-origin: border-box;
            background-clip: padding-box, border-box;

            animation: borderColor 5s linear infinite;

            box-shadow:
                0 0 18px rgba(0, 229, 255, 0.3),
                0 0 45px rgba(0, 102, 255, 0.12);

            z-index: 5;
        }

        /* ขอบไล่สีอัตโนมัติ */
        @keyframes borderColor {

            0% {
                background-position:
                    0 0,
                    0% 50%;
            }

            25% {
                background-position:
                    0 0,
                    50% 0%;
            }

            50% {
                background-position:
                    0 0,
                    100% 50%;
            }

            75% {
                background-position:
                    0 0,
                    50% 100%;
            }

            100% {
                background-position:
                    0 0,
                    0% 50%;
            }
        }

        /* เส้นด้านบน */
        .top-line {
            width: 100%;
            height: 2px;

            margin-bottom: 14px;

            background: linear-gradient(
                90deg,
                #003cff,
                #00e5ff,
                #b8f5ff,
                #00e5ff,
                #003cff
            );

            background-size: 300% 100%;

            animation: lineColor 4s linear infinite;

            box-shadow: 0 0 10px #00e5ff;
        }

        @keyframes lineColor {

            0% {
                background-position: 0%;
            }

            100% {
                background-position: 300%;
            }
        }

        /* =========================
           หัวข้อ
        ========================= */

        .title {
            text-align: center;

            font-family: 'Orbitron', sans-serif;

            font-size: clamp(17px, 4.5vw, 24px);

            letter-spacing: 1px;

            color: #b8f5ff;

            text-shadow:
                0 0 8px #00e5ff,
                0 0 18px rgba(0, 229, 255, 0.6);
        }

        .subtitle {
            text-align: center;

            margin-top: 3px;
            margin-bottom: 12px;

            color: #6ee7f7;

            font-size: 11px;
        }

        /* สถานะ */
        .status {
            display: flex;
            justify-content: center;
            align-items: center;

            gap: 6px;

            margin-bottom: 12px;

            color: #00ff9d;

            font-family: 'Orbitron', sans-serif;

            font-size: 8px;
        }

        .status-dot {
            width: 6px;
            height: 6px;

            background: #00ff9d;

            border-radius: 50%;

            box-shadow: 0 0 8px #00ff9d;
        }

        /* =========================
           ข้อมูล
        ========================= */

        .info {
            display: flex;
            align-items: center;

            width: 100%;

            margin: 7px 0;
            padding: 9px 10px;

            border: 1px solid transparent;
            border-radius: 8px;

            background-image:
                linear-gradient(
                    rgba(4, 18, 28, 0.96),
                    rgba(4, 18, 28, 0.96)
                ),
                linear-gradient(
                    120deg,
                    #003cff,
                    #00aaff,
                    #b8f5ff,
                    #00e5ff,
                    #0066ff,
                    #003cff
                );

            background-size:
                100% 100%,
                300% 300%;

            background-origin: border-box;
            background-clip: padding-box, border-box;

            animation: borderColor 5s linear infinite;
        }

        .icon {
            width: 38px;
            min-width: 38px;

            text-align: center;

            font-size: 18px;

            color: #b8f5ff;
        }

        .text {
            min-width: 0;
            flex: 1;
        }

        .label {
            display: block;

            color: #5ee7f7;

            font-size: 9px;
        }

        .value {
            display: block;

            color: white;

            font-size: clamp(13px, 3.5vw, 16px);

            line-height: 1.3;

            overflow-wrap: anywhere;
        }

        .code {
            font-family: 'Orbitron', sans-serif;

            color: #00ff9d;
        }

        /* =========================
           Skills
        ========================= */

        .skills-title {
            margin-top: 12px;
            margin-bottom: 7px;

            text-align: center;

            color: #b8f5ff;

            font-family: 'Orbitron', sans-serif;

            font-size: 12px;

            text-shadow: 0 0 8px #00e5ff;
        }

        .skills {
            display: grid;

            grid-template-columns: repeat(4, 1fr);

            gap: 6px;
        }

        .skill {
            padding: 8px 4px;

            text-align: center;

            color: #e8fcff;

            font-family: 'Orbitron', sans-serif;

            font-size: 8px;

            border: 1px solid transparent;
            border-radius: 7px;

            background-image:
                linear-gradient(
                    rgba(4, 18, 28, 0.96),
                    rgba(4, 18, 28, 0.96)
                ),
                linear-gradient(
                    120deg,
                    #003cff,
                    #00aaff,
                    #b8f5ff,
                    #00e5ff,
                    #0066ff,
                    #003cff
                );

            background-size:
                100% 100%,
                300% 300%;

            background-origin: border-box;
            background-clip: padding-box, border-box;

            animation: borderColor 5s linear infinite;
        }

        .skill:nth-child(2) {
            animation-delay: -1s;
        }

        .skill:nth-child(3) {
            animation-delay: -2s;
        }

        .skill:nth-child(4) {
            animation-delay: -3s;
        }

        /* =========================
           Instagram
        ========================= */

        .social {
            display: flex;

            justify-content: center;
            align-items: center;

            gap: 6px;

            margin-top: 10px;

            color: #7ddfff;

            font-size: 10px;
        }

        .instagram {
            font-family: 'Orbitron', sans-serif;

            color: #b8f5ff;

            text-shadow:
                0 0 7px rgba(0, 229, 255, 0.7);
        }

        /* =========================
           ด้านล่าง
        ========================= */

        .bottom {
            display: flex;
            align-items: center;

            gap: 7px;

            margin-top: 10px;

            color: #397985;

            font-family: monospace;

            font-size: 8px;

            white-space: nowrap;
        }

        .bottom::before,
        .bottom::after {
            content: "";

            height: 1px;

            flex: 1;

            background: #174e5a;
        }

        /* =========================
           มุมการ์ด
        ========================= */

        .corner {
            position: absolute;

            width: 13px;
            height: 13px;

            border-color: #00e5ff;
            border-style: solid;
        }

        .top-left {
            top: -2px;
            left: -2px;

            border-width: 2px 0 0 2px;
        }

        .top-right {
            top: -2px;
            right: -2px;

            border-width: 2px 2px 0 0;
        }

        .bottom-left {
            bottom: -2px;
            left: -2px;

            border-width: 0 0 2px 2px;
        }

        .bottom-right {
            bottom: -2px;
            right: -2px;

            border-width: 0 2px 2px 0;
        }

        /* =========================
           Responsive
        ========================= */

        @media (max-width: 700px) {

            .computer {
                left: -30px;
                bottom: 3%;
                opacity: 0.09;
            }

            .siberian-cat {
                right: -25px;
                bottom: 3%;
                opacity: 0.12;
            }
        }

        @media (max-width: 500px) {

            body {
                padding: 7px;
            }

            .card {
                padding: 17px 13px;
            }

            .info {
                margin: 5px 0;
                padding: 8px;
            }

            .icon {
                width: 34px;
                min-width: 34px;

                font-size: 17px;
            }

            .value {
                font-size: 13px;
            }

            .skills-title {
                margin-top: 9px;
            }

            .skill {
                padding: 7px 2px;

                font-size: 7px;
            }

            .social {
                margin-top: 8px;
            }

            .bottom {
                margin-top: 7px;
            }
        }

        @media (max-height: 650px) {

            .card {
                padding: 13px 17px;
            }

            .top-line {
                margin-bottom: 9px;
            }

            .subtitle {
                margin-bottom: 8px;
            }

            .status {
                margin-bottom: 8px;
            }

            .info {
                margin: 4px 0;
                padding: 6px 8px;
            }

            .skills-title {
                margin-top: 8px;
                margin-bottom: 5px;
            }

            .skill {
                padding: 6px 2px;
            }

            .social {
                margin-top: 6px;
            }

            .bottom {
                margin-top: 5px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         พื้นหลัง
    ========================= -->

    <div class="tech-background">

        <!-- คอมพิวเตอร์ -->
        <div class="computer">

            <div class="monitor">
                <div class="screen"></div>
            </div>

            <div class="monitor-stand"></div>

            <div class="monitor-base"></div>

        </div>


        <!-- Siberian Cat -->
        <div class="siberian-cat">

            <div class="cat">

                <div class="ear left"></div>
                <div class="ear right"></div>

                <div class="cat-face">

                    <div class="eye left"></div>
                    <div class="eye right"></div>

                    <div class="nose"></div>

                    <div class="mouth"></div>

                    <div class="whisker left-1"></div>
                    <div class="whisker left-2"></div>

                    <div class="whisker right-1"></div>
                    <div class="whisker right-2"></div>

                </div>

            </div>

            <div class="cat-label">
                SIBERIAN
            </div>

        </div>

    </div>


    <!-- =========================
         การ์ดข้อมูล
    ========================= -->

    <div class="card">

        <div class="corner top-left"></div>
        <div class="corner top-right"></div>
        <div class="corner bottom-left"></div>
        <div class="corner bottom-right"></div>

        <div class="top-line"></div>


        <div class="title">
            INFORMATION TECHNOLOGY
        </div>

        <div class="subtitle">
            STUDENT IT
        </div>


        <div class="status">
            <span class="status-dot"></span>
            SYSTEM ONLINE
        </div>


        <!-- ชื่อ -->
        <div class="info">

            <div class="icon">👤</div>

            <div class="text">

                <span class="label">
                    NAME - SURNAME
                </span>

                <span class="value">
                    ภัทรพล แสงนาฮาย
                </span>

            </div>

        </div>


        <!-- รหัส -->
        <div class="info">

            <div class="icon">#</div>

            <div class="text">

                <span class="label">
                    STUDENT ID
                </span>

                <span class="value code">
                    032
                </span>

            </div>

        </div>


        <!-- Email -->
        <div class="info">

            <div class="icon">✉</div>

            <div class="text">

                <span class="label">
                    EMAIL
                </span>

                <span class="value">
                    68219010032@kbtc.ac.th
                </span>

            </div>

        </div>


        <!-- แผนก -->
        <div class="info">

            <div class="icon">💻</div>

            <div class="text">

                <span class="label">
                    DEPARTMENT
                </span>

                <span class="value">
                    เทคโนโลยีสารสนเทศ
                </span>

            </div>

        </div>


        <!-- โรงเรียน -->
        <div class="info">

            <div class="icon">🏫</div>

            <div class="text">

                <span class="label">
                    INSTITUTION
                </span>

                <span class="value">
                    วิทยาลัยเทคนิคกระบี่
                </span>

            </div>

        </div>


        <!-- Skills -->
        <div class="skills-title">
            SKILLS AND ABILITIES
        </div>


        <div class="skills">

            <div class="skill">
                HTML
            </div>

            <div class="skill">
                JavaScript
            </div>

            <div class="skill">
                Git
            </div>

            <div class="skill">
                GitHub
            </div>

        </div>


        <!-- Instagram -->
        <div class="social">

            <span>◎</span>

            <span>
                Instagram
            </span>

            <span class="instagram">
                @kksaxphyy
            </span>

        </div>


        <div class="bottom">
            IT_STUDENT_PROFILE
        </div>

    </div>

</body>
</html>
