<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แนะนำตัว - นาย ณัฐพรษ์ อุดมศรี</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        body {
            /* พื้นหลังไล่เฉดสีลึกพร้อมเอฟเฟกต์แสง */
            background: radial-gradient(circle at top left, #2e1065, transparent 40%),
                        radial-gradient(circle at bottom right, #1e1b4b, transparent 40%),
                        #0f172a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* การ์ดพร้อมแอนิเมชันเปิดตัว */
        .profile-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 40px 30px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4),
                        inset 0 1px 0 rgba(255, 255, 255, 0.2);
            text-align: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: fadeInUp 0.8s ease-out;
        }

        .profile-card:hover {
            transform: translateY(-8px);
            border-color: rgba(168, 85, 247, 0.4);
            box-shadow: 0 40px 80px rgba(112, 26, 117, 0.3),
                        0 0 40px rgba(99, 102, 241, 0.2);
        }

        /* รูปโปรไฟล์พร้อมแสง Glow */
        .img-container {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 20px;
        }

        .img-container::before {
            content: '';
            position: absolute;
            top: -4px; left: -4px; right: -4px; bottom: -4px;
            background: linear-gradient(45deg, #6366f1, #a855f7, #ec4899);
            border-radius: 50%;
            z-index: 0;
            opacity: 0.7;
            filter: blur(8px);
            transition: opacity 0.3s;
        }

        .profile-card:hover .img-container::before {
            opacity: 1;
            filter: blur(12px);
        }

        .profile-img {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.9);
        }

        .profile-name {
            font-size: 1.6rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 4px;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .profile-role {
            font-size: 0.85rem;
            color: #c084fc;
            margin-bottom: 24px;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* รายการข้อมูลประจำตัว */
        .info-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
            text-align: left;
        }

        .info-item {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px 16px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            transition: all 0.3s ease;
        }

        .info-item:hover {
            background: rgba(255, 255, 255, 0.09);
            transform: translateX(5px);
            border-color: rgba(168, 85, 247, 0.3);
        }

        .info-icon {
            font-size: 1.2rem;
            margin-right: 14px;
            width: 24px;
            text-align: center;
        }

        .info-label {
            color: #94a3b8;
            font-size: 0.75rem;
            display: block;
        }

        .info-value {
            color: #f8fafc;
            font-weight: 500;
            font-size: 0.92rem;
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
            margin: 24px 0;
            border: none;
        }

        /* หมวดหมู่ทักษะ */
        .skills-section {
            text-align: left;
        }

        .skills-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: #e2e8f0;
            margin-bottom: 14px;
        }

        .skills-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .skill-tag {
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(168, 85, 247, 0.3);
            color: #e0e7ff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 400;
            transition: all 0.3s ease;
        }

        .skill-tag:hover {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(168, 85, 247, 0.4);
            transform: translateY(-2px);
        }

        /* Keyframe สำหรับ แอนิเมชันเปิดตัว */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <div class="img-container">
            <img src="https://i.ibb.co/gZCVnn50/images.jpg" alt="รูปโปรไฟล์" class="profile-img">
        </div>

        <h1 class="profile-name">นาย ณัฐพรษ์ อุดมศรี</h1>
        <p class="profile-role">Student / Developer</p>

        <div class="info-list">
            <div class="info-item">
                <span class="info-icon">🪪</span>
                <div>
                    <span class="info-label">รหัสประจำตัว</span>
                    <span class="info-value">68219010026</span>
                </div>
            </div>

            <div class="info-item">
                <span class="info-icon">💻</span>
                <div>
                    <span class="info-label">แผนกวิชา</span>
                    <span class="info-value">เทคโนโลยีสารสนเทศ</span>
                </div>
            </div>

            <div class="info-item">
                <span class="info-icon">🏫</span>
                <div>
                    <span class="info-label">สถานศึกษา</span>
                    <span class="info-value">วิทยาลัยเทคนิคกระบี่</span>
                </div>
            </div>

            <div class="info-item">
                <span class="info-icon">✉️</span>
                <div>
                    <span class="info-label">อีเมล</span>
                    <span class="info-value">68219010026@kbtc.ac.th</span>
                </div>
            </div>
        </div>

        <hr class="divider">

        <div class="skills-section">
            <div class="skills-title">⚡ ทักษะความสามารถ</div>
            <div class="skills-container">
                <span class="skill-tag">HTML5 / CSS3</span>
                <span class="skill-tag">JavaScript</span>
                <span class="skill-tag">Python</span>
                <span class="skill-tag">Git / GitHub</span>
                <span class="skill-tag">Graphic Design</span>
            </div>
        </div>
    </div>

</body>
</html>
